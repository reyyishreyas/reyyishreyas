<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Reyyi Shreyas. AI/ML engineer, researcher, open source. Portrait rendered as ASCII characters generated from a photo.">
  <title>Reyyi Shreyas. AI/ML engineer, researcher, open source. Portrait rendered as ASCII characters generated from a photo.</title>
  <style>
    .prompt {
      font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.02em;
      fill: #b45309;
    }
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 92px;
      font-weight: 700;
      letter-spacing: -0.025em;
      fill: url(#sheen);
    }
    .role {
      font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.08em;
      fill: #52525b;
    }
    .art {
      font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 5.0px;
      fill: #18181b;
    }
    .cap {
      font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 10.5px;
      letter-spacing: 1.1px;
      fill: #52525b;
    }
  </style>
  <defs>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="300" y2="0">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="0.46" stop-color="#18181b"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="0.54" stop-color="#18181b"/>
      <stop offset="1" stop-color="#18181b"/>
      <animate attributeName="x1" values="-400;1000" dur="4.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="300;1700" dur="4.5s" begin="0.8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="339" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>

  <!-- faint scanline sweeping the panel, behind the text -->
  <rect x="0" y="-8" width="1200" height="2.5" fill="#d97706" opacity="0.13">
    <animate attributeName="y" values="-8;348" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal prompt with blinking caret -->
  <text class="prompt" x="64" y="84">&#10095; reyyishreyas</text>
  <rect x="262" y="67" width="10" height="21" fill="#d97706">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text class="name" x="60" y="196">REYYI SHREYAS</text>

  <!-- self-drawing rule -->
  <rect x="64" y="226" width="0" height="4" fill="#d97706">
    <animate attributeName="width" from="0" to="118" dur="0.9s" begin="0.3s" fill="freeze"/>
  </rect>

  <text class="role" x="64" y="274">AI/ML ENGINEER  |  RESEARCH  |  OPEN SOURCE</text>

